[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devharness"
version = "0.1.0"
description = "Control plane for long-running coding and ops agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Colt Mercer" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.7,<3",
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
    "anyio>=4.4,<5",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
server = [
    "starlette>=0.37,<1",
    "uvicorn>=0.30,<1",
    "sse-starlette>=2.0,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]
memory-neo4j = [
    "neo4j>=5.20,<6",
]
browser = [
    "playwright>=1.40,<2",
    "pillow>=10.0,<11",
]
slack = [
    "slack-sdk>=3.27,<4",
]
observers = [
    "psutil>=5.9,<6",
]
all = [
    "devharness[server,memory-neo4j,browser,slack,observers]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
harness = "devharness.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/devharness"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
